<title id="title">Tiebreaks and deciding sets show the clearest lift.</title>
<desc id="desc">Within-match changes with 95% intervals: tiebreaks +1.62, deciding sets +0.86, high importance +0.68; break-point comparisons overlap zero.</desc>
