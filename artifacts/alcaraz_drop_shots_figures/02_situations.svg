<text x="76" y="929.940" fill="#65716A" font-size="17" font-weight="400" text-anchor="start">Each situation is compared with other points in the same matches, adjusted for serving status and stroke order. Lines show 95% CIs.</text>
<text x="76" y="954.940" fill="#65716A" font-size="17" font-weight="400" text-anchor="start">Selected contexts; the report includes all splits. Tiebreak/deciding-set results are exploratory. Both break-point intervals include zero.</text>
<text x="76" y="979.940" fill="#65716A" font-size="17" font-weight="400" text-anchor="start">Sample sizes: 75 / 65 / 196 / 188 / 218 matches, respectively. Intervals are not adjusted for multiple comparisons.</text>
