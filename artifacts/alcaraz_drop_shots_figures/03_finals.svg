<text x="76" y="929.940" fill="#65716A" font-size="17" font-weight="400" text-anchor="start">Descriptive case studies. Initiating baseline drops, including failed attempts; returns, net drops and re-drops excluded.</text>
<text x="76" y="954.940" fill="#65716A" font-size="17" font-weight="400" text-anchor="start">Fifth-set attempts / eligible strokes: Wimbledon 5 / 74; Roland Garros 9 / 136. One unobservable Roland Garros point is excluded.</text>
<text x="76" y="979.940" fill="#65716A" font-size="17" font-weight="400" text-anchor="start">The Wimbledon chart records 4 points won from 5 fifth-set drops, rather than the quoted 5 / 6. These finals alone do not establish a wider effect.</text>
