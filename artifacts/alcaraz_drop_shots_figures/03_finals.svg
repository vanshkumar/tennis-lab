<title id="title">His drop-shot rate peaked in set five of both finals.</title>
<desc id="desc">Baseline drop attempts per 100 eligible strokes peak at 6.8 in Wimbledon 2023 set five and 6.6 in Roland Garros 2025 set five.</desc>
